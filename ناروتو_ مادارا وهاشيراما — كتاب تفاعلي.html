<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ناروتو: مادارا وهاشيراما — كتاب تفاعلي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0d16;--card:#141829;--ink:#ece8f0;--mut:#9a9fb8;--acc:#e0242e;--gold:#6a7396;--soft:#1b2036;--ok:#5fc489;--bad:#ff7a6e}
:root[data-theme="light"]{--bg:#e6e8ef;--card:#f6f6fa;--ink:#14172a;--mut:#555b78;--acc:#b8141c;--gold:#7b84a8;--soft:#dcdfea;--ok:#2e7d4f;--bad:#b3392b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,rgba(224,36,46,.2),transparent 60%) fixed,var(--bg);color:var(--ink);font-family:"Amiri","Noto Naskh Arabic",Tahoma,serif;font-size:19px;line-height:1.9}
button{font:inherit;color:inherit;cursor:pointer}
header{max-width:1000px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{color:var(--acc);font-weight:700}
#dots{display:flex;gap:7px;flex-wrap:wrap}#dots button{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--gold);background:none;padding:0}#dots button.on{background:var(--acc);border-color:var(--acc);transform:scale(1.25)}
.ic{background:var(--soft);border:1px solid var(--gold);border-radius:10px;padding:0 12px}
main{max-width:1000px;margin:auto;padding:6px 16px 40px}
.pg{animation:in .45s ease}@keyframes in{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pg,.hot{animation:none!important}}
.ttl{color:var(--acc);font-size:1.7rem;margin:.2em 0 .5em}.ttl::after{content:"● ● ●";display:block;font-size:.6rem;color:var(--acc);letter-spacing:8px;margin-top:2px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:5px 24px;box-shadow:0 3px 0 rgba(0,0,0,.25)}.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--gold);box-shadow:none}.btn.sm{padding:0 16px;margin-top:6px}.btn:disabled{opacity:.4}
.cov{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;padding-top:10px}
.cimg{width:min(340px,88vw);border-radius:6px 14px 14px 6px;box-shadow:-10px 10px 28px rgba(0,0,0,.4);border-inline-start:8px solid var(--acc)}
.big{font-size:2.6rem;margin:0;color:var(--acc);line-height:1.3}.sub{font-size:1.3rem;color:var(--mut);margin:.3em 0 1em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mc{display:flex;flex-direction:column;gap:2px;text-align:start;background:var(--card);border:1px solid var(--gold);outline:1px solid var(--gold);outline-offset:3px;border-radius:12px;padding:10px;transition:transform .2s}.mc:hover{transform:translateY(-4px)}
.mc img{width:100%;height:160px;object-fit:cover;border-radius:8px}.mc small{color:var(--mut)}.mc em{color:var(--acc);font-style:normal;font-size:.85rem}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.chap{display:grid;gap:20px}@media(min-width:820px){.chap{grid-template-columns:1fr 1fr;align-items:start}}
.stage{position:relative;margin:auto;width:100%;border:3px solid var(--gold);border-radius:10px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.3)}.stage img{display:block;width:100%;height:100%;object-fit:cover}
.hot{position:absolute;width:32px;height:32px;margin:-16px;border-radius:50%;border:2px solid #fff;background:var(--acc);color:#fff;font-weight:700;padding:0;animation:p 2s infinite}.hot.seen{background:var(--ok);animation:none}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(200,60,40,.65)}100%{box-shadow:0 0 0 15px rgba(200,60,40,0)}}
.note{background:var(--soft);border-inline-start:4px solid var(--acc);border-radius:10px;padding:6px 14px;margin-top:10px;min-height:3.8em}
.cnt{color:var(--mut);font-size:.9rem;margin-top:4px}.kick{color:var(--gold)}
.tabs{display:flex;gap:6px;margin:6px 0}.tabs button{background:var(--soft);border:1px solid var(--gold);border-radius:10px;padding:0 16px}.tabs button[aria-selected=true]{background:var(--gold);color:#fff}
#pane p{margin:.4em 0}#pane .fresh{animation:in .5s}
.think{background:var(--card);border:1px dashed var(--gold);border-radius:12px;padding:8px 14px;margin-top:14px}.think p{margin:.2em 0}
.think button,.opt{display:block;width:100%;text-align:start;background:var(--soft);border:1px solid transparent;border-radius:10px;padding:2px 14px;margin:6px 0}.think button.sel{border-color:var(--acc)}.resp{color:var(--acc)}
.ctl{display:flex;justify-content:space-between;margin-top:22px}
.steps{display:flex;gap:8px;flex-wrap:wrap}.steps button{background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:0 14px 0 6px}.steps button.on{background:var(--acc);color:#fff}.steps i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#fff;font-style:normal;margin-inline-end:6px}
.big2{font-size:1.2rem;margin-top:14px}.bar{height:7px;background:var(--soft);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.opt.ok{border-color:var(--ok);color:var(--ok)}.opt.no{border-color:var(--bad);color:var(--bad)}
</style></head><body>

{t:"١. اللقاء عند ضفاف النهر",r:[396,631],sub:"مادارا وهاشيراما يرميان الحجارة",
story:["في زمنٍ مزّقته الحروب والصراعات بين العشائر، التقى مادارا الصغير بفتى غريب عند ضفة النهر.","تنافسا في رمي الحجارة المسطحة فوق سطح الماء، وسرعان ما نشأت بينهما صداقة صادقة بعيدة عن ضجيج السيوف وأحقاد الكبار.","لم يسأل أيٌّ منهما الآخر عن عشيرته؛ كان يكفيهما أن الحجر يقفز على الماء مرة بعد مرة."],
bg:["عصر الحروب: عاش الأوتشيها والسينجو في زمن تتقاتل فيه العشائر المحاربة (النينجا) باستمرار، وكانت الطفولة نفسها ميداناً للتدريب على القتال.","الحياة الخطرة: كثيراً ما كان الأطفال يخسرون إخوتهم وآباءهم في المعارك، لذلك كان لقاء صديق خارج هذا الصراع شيئاً نادراً وثميناً."],
sym:["النهر خط فاصل بين عالمين، لكنه في الوقت نفسه المكان الوحيد الذي التقيا فيه.","الحجر الذي يقفز فوق الماء يشبه الصداقة نفسها: خفيفة في ظاهرها، وتحتاج توازناً حتى لا تغرق."],
h:[[70,63,"الحجر المسطح في يد هاشيراما: بدأت الصداقة بلعبة بسيطة، لا بسلاح."],[35,9,"«م... من أنت؟» سؤال مادارا الحذر. هو لا يعرف بعد أن الغريب من العشيرة العدوة."],[48,52,"النهر: حدّ طبيعي بين أرضين متخاصمتين، وسيعود لاحقاً شاهداً على الفراق."]]},
{t:"٢. الحلم المشترك فوق الجرف",r:[437,537],sub:"الجرف المطل على الوادي",
story:["تدرّب الصديقان معاً في الغابة، وصعدا إلى أعلى الجرف المطل على الوادي.","من هناك رسما في خيالهما ملامح قرية مسالمة تجمع العشائر تحت سقف واحد، حيث لا يُضطر الأطفال لخوض المعارك أو فقد إخوتهم.","كان هاشيراما يتكلم بحماس، ومادارا يصغي بجدية وفي قلبه الحلم نفسه."],
bg:["حلم القرية: هذه الفكرة هي النواة الأولى لما سيصبح لاحقاً قرية كونوها، حين تحالف الأوتشيها والسينجو.","اختلاف الطبعين: هاشيراما متفائل منفتح، ومادارا أكثر جدية وحذراً، وهذا التكامل جعلهما قريبين."],
sym:["الارتفاع يرمز إلى نظرة أبعد من أحقاد الحاضر.","الوادي والنهر تحتهما يمثلان العالم الذي يريدان تغييره."],
h:[[84,30,"هاشيراما يشير إلى الأفق: هنا يولد حلم قرية تحمي الأطفال."],[28,42,"مادارا عابس لكنه منصت؛ يخفي حماسه خلف جدّيته."],[82,72,"النهر المتعرّج في الوادي: الطريق الذي سيسلكانه معاً، قبل أن يفترق."]]},
{t:"٣. التحذير الصامت وانكشاف الحقيقة",r:[834,1024],sub:"الحجر المكتوب عليه التحذير",
story:["حين أعدّت كل عشيرة كميناً للأخرى عند النهر، رفض الصديقان الخيانة.","فكتب كلٌّ منهما تحذيراً سرياً على حجر وقذفه عبر الماء لإنقاذ صديقه.","وفي تلك اللحظة انكشف السر القاسي: أحدهما من عشيرة الأوتشيها، والآخر من عشيرة السينجو."],
bg:["الصدمة: اكتشف كل منهما أن صديقه هو الشخص الذي أُمر بقتاله، وأن عليه الاختيار بين الصداقة والعشيرة.","الولاء: في ذلك العصر كان الولاء للعشيرة يعلو على الرغبات الشخصية."],
sym:["الحجر كان أداة اللعب في الفصل الأول، وصار هنا وسيلة إنقاذ؛ نفس الشيء بمعنيين.","الحافة الصخرية ترمز إلى أنهما يقفان على حدّ بين الصداقة والعداء."],
h:[[61,66,"اللفافة تكشف الحقيقة: «مادارا من الأوتشيها، وهاشيراما من السينجو»."],[35,48,"دموع مادارا: ألمُ من يدرك أن الخيار القادم مؤلم مهما اختار."],[65,86,"حافة الجرف: الخطر لم يعد على الحجارة بل على الصداقة."]]},
{t:"٤. قطع الرابطة وإيقاظ الشارينغان",r:[765,1024],sub:"مادارا يستدير ويغادر",
story:["لأن مادارا لم يبقَ له من الإخوة سوى إيزونا، اختار حماية أخيه وعشيرته فوق كل شيء.","أعلن بحزن قطع رابطة الصداقة، واستدار مغادراً ضفة النهر.","وفي عينيه استيقظت الشارينغان للمرة الأولى."],
bg:["الشارينغان: عين خاصة بالأوتشيها تستيقظ عادة تحت وطأة المشاعر القوية كالألم والفقد.","إيزونا: أخو مادارا الأصغر، وسبب قراره بالتخلي عن صداقته؛ فقد كانت العشيرة وأخوه ما تبقى له."],
sym:["الغروب يرمز إلى نهاية الطفولة وبراءة تلك الأيام.","عينان حمراوان وظهر مدار: التحول من طفل صديق إلى محارب يحمل عبء عشيرته."],
h:[[81,57,"عينا مادارا الحمراوان: الشارينغان تستيقظ للمرة الأولى."],[38,46,"يد هاشيراما الممدودة: ما زال يأمل في أن تبقى الصداقة."],[58,16,"الغروب: آخر لحظة من طفولة مشتركة قبل أن يفترق الدربان."]]}
];

L={cover:"الغلاف",menu:"الفهرس",ch1:"الفصل ١",ch2:"الفصل ٢",ch3:"الفصل ٣",ch4:"الفصل ٤",tl:"الخط الزمني",quiz:"الاختبار",end:"الخاتمة"};
const $=s=>document.querySelector(s),S={tab:[0,0,0,0],rev:[1,1,1,1],hot:[new Set,new Set,new Set,new Set],ans:{},qi:0,sc:0,pick:null,tl:0};
const nav=v=>{const i=V.indexOf(v);return `<div class="ctl"><button class="btn alt" data-go="${V[i-1]}">▸ السابق</button>${i<V.length-1?`<button class="btn" data-go="${V[i+1]}">التالي ◂</button>`:"<span></span>"}</div>`};
const views={
cover:()=>`<div class="cov"><img class="cimg" src="${IM.cf}" alt="غلاف الكتاب"><div><h1 class="big">ناروتو:<br>مادارا وهاشيراما</h1><p class="sub">طفولة مشتركة ومصير مفترق</p><button class="btn" data-go="menu">افتح الكتاب ◂</button></div></div>`,
menu:()=>`<h2 class="ttl">الفهرس</h2><div class="grid">${C.map((c,i)=>`<button class="mc" data-go="ch${i+1}"><img src="${IM.c[i]}" alt=""><b>${c.t}</b><small>${c.sub}</small><em>${S.hot[i].size} من ${c.h.length} تفاصيل مكتشفة</em></button>`).join("")}</div><div class="row"><button class="btn alt" data-go="tl">الخط الزمني</button><button class="btn alt" data-go="quiz">اختبر نفسك</button></div>`,
tl:v=>`<h2 class="ttl">الخط الزمني</h2><div class="steps">${TL.map((t,k)=>`<button data-tl="${k}" class="${S.tl==k?"on":""}"><i>${k+1}</i>${t[0]}</button>`).join("")}</div><div class="note big2"><b>${TL[S.tl][0]}</b><p>${TL[S.tl][1]}</p></div>${nav(v)}`,
quiz:v=>{if(S.qi>=Q.length)return `<h2 class="ttl">نتيجتك: ${S.sc} من ${Q.length}</h2><p>${S.sc==Q.length?"ممتاز! أنت تعرف القصة جيداً.":S.sc>=2?"جيد جداً، راجع الفصول لتتقن التفاصيل.":"حاول من جديد بعد قراءة الفصول."}</p><div class="row"><button class="btn alt" data-qr="1">أعد الاختبار</button><button class="btn" data-go="end">الخاتمة ◂</button></div>`;
const q=Q[S.qi];return `<h2 class="ttl">اختبر نفسك</h2><small>سؤال ${S.qi+1} من ${Q.length}</small><div class="bar"><i style="width:${(S.qi+1)/Q.length*100}%"></i></div><h3>${q[0]}</h3>${q[1].map((o,j)=>`<button class="opt ${S.pick!=null?(j==q[2]?"ok":j==S.pick?"no":""):""}" data-q="${j}">${o}</button>`).join("")}${S.pick!=null?`<button class="btn" data-qn="1">${S.qi==Q.length-1?"النتيجة":"التالي"} ◂</button>`:""}`},
end:()=>`<div class="cov"><img class="cimg" src="${IM.cb}" alt="الغلاف الخلفي"><div><h2 class="ttl">النهاية... أم البداية؟</h2><p>هل يمكن للصداقة أن تنجو من ويلات الحرب؟</p><div class="row"><button class="btn" data-go="menu">الفهرس</button><button class="btn alt" data-go="cover">من البداية</button></div></div></div>`};
V.slice(2,6).forEach((v,i)=>views[v]=()=>{const c=C[i];return `<div class="chap"><div><div class="stage" style="aspect-ratio:${c.r[0]}/${c.r[1]};max-width:${Math.min(520,c.r[0]/c.r[1]*600)}px"><img src="${IM.c[i]}" alt="${c.sub}">${c.h.map((h,j)=>`<button class="hot ${S.hot[i].has(j)?"seen":""}" style="left:${h[0]}%;top:${h[1]}%" data-hot="${i},${j}" aria-label="تفصيلة ${j+1}">${j+1}</button>`).join("")}</div><div class="note" id="nt">اضغط على الدوائر فوق الصورة لاكتشاف تفاصيلها.</div><div class="cnt" id="cn"></div></div><div><small class="kick">الفصل ${i+1} من 4</small><h2 class="ttl">${c.t.split(". ")[1]}</h2><div class="tabs">${TB.map((n,k)=>`<button data-tab="${i},${k}" aria-selected="${S.tab[i]==k}">${n}</button>`).join("")}</div><div id="pane"></div><div id="think"></div></div></div>${nav(v)}`});
function pane(i){const k=S.tab[i],a=[C[i].story,C[i].bg,C[i].sym][k],n=k?a.length:S.rev[i];
$("#pane").innerHTML=a.slice(0,n).map((p,x)=>`<p class="${k==0&&n>1&&x==n-1?"fresh":""}">${p}</p>`).join("")+(k==0&&n<a.length?`<button class="btn sm" data-rev="${i}">تابع القراءة ◂</button>`:"");
const [q,o]=R[i],a2=S.ans[i];$("#think").innerHTML=(k==0&&n<a.length)?"":`<div class="think"><b>فكّر معنا</b><p>${q}</p>${o.map((x,j)=>`<button data-opt="${i},${j}" class="${a2==j?"sel":""}">${x[0]}</button>`).join("")}${a2!=null?`<p class="resp">${o[a2][1]}</p>`:""}</div>`;cnt(i)}
function cnt(i){const n=S.hot[i].size,t=C[i].h.length;$("#cn").textContent=`اكتشفت ${n} من ${t} تفاصيل${n==t?" ✓":""}`}
function render(sc){let v=location.hash.slice(1);if(!V.includes(v))v="cover";S.v=v;
$("#dots").innerHTML=V.map(x=>`<button class="${x==v?"on":""}" data-go="${x}" aria-label="${L[x]}" title="${L[x]}"></button>`).join("");
$("#app").innerHTML=`<div class="pg">${views[v](v)}</div>`;if(v[0]=="c"&&v[1]=="h")pane(+v[2]-1);if(sc)window.scrollTo(0,0)}
addEventListener("hashchange",()=>render(1));
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
if(d.go)location.hash=d.go;
else if(d.hot){const [i,j]=d.hot.split(",").map(Number);S.hot[i].add(j);t.classList.add("seen");$("#nt").textContent=C[i].h[j][2];cnt(i)}
else if(d.tab){const [i,k]=d.tab.split(",").map(Number);S.tab[i]=k;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b===t));pane(i)}
else if(d.rev){S.rev[+d.rev]++;pane(+d.rev)}
else if(d.opt){const [i,j]=d.opt.split(",").map(Number);S.ans[i]=j;pane(i)}
else if(d.tl!==undefined){S.tl=+d.tl;render()}
else if(d.q!==undefined){if(S.pick==null){S.pick=+d.q;if(S.pick==Q[S.qi][2])S.sc++;render()}}
else if(d.qn){S.qi++;S.pick=null;render()}
else if(d.qr){S.qi=0;S.sc=0;S.pick=null;render()}
else if(t.id=="th"){const r=document.documentElement;r.dataset.theme=r.dataset.theme=="light"?"dark":"light"}});
const go=n=>{const i=V.indexOf(S.v)+n;if(V[i])location.hash=V[i]};
document.addEventListener("keydown",e=>{if(e.key=="ArrowLeft")go(1);if(e.key=="ArrowRight")go(-1)});
let tx,ty;document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>90&&Math.abs(dy)<50)go(dx>0?1:-1)},{passive:true});
render(1);
</script></body></html>
